<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梯度健康仪表盘 — 模型血常规</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2933;--muted:#66748a;--line:#d7deea;--accent:#3b6ef5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;}
  .wrap{max-width:940px;margin:0 auto;padding:24px 18px 40px;}
  h1{font-size:21px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.6;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(40,60,110,.05);}
  .presets{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .presets span{font-size:13px;color:var(--muted);}
  button{font-family:inherit;font-size:14px;border:none;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;transition:.15s;}
  .primary{background:var(--accent);color:#fff;} .primary:hover{filter:brightness(1.06);}
  .preset{background:#eef2fb;color:var(--accent);} .preset:hover{background:#e2e9f8;}
  .preset.active{background:var(--accent);color:#fff;}
  canvas{display:block;width:100%;height:auto;background:#fdfefe;border-radius:10px;border:1px solid var(--line);margin-top:14px;}
  .log{margin-top:12px;background:#0f1726;color:#cfe3ff;border-radius:10px;padding:10px 12px;
    font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;height:120px;overflow-y:auto;}
  .log .g{color:#5fe39a;} .log .y{color:#f4c542;} .log .r{color:#ff7b72;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;}
  .note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px;}
  code{background:#eef2fb;padding:1px 6px;border-radius:6px;color:#345;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>梯度健康仪表盘</h1>
  <p class="sub">梯度范数（grad_norm）是训练中的「血常规」：一个数值就能代表某一层的健康程度。左侧实时滚动打印各层 grad_norm 条形图，右侧用红/黄/绿标注整体健康度。切换「正常初始化 / 全零初始化 / 学习率过大」三种预设，观察仪表盘从绿变红的过程，理解梯度消失与爆炸。</p>

  <div class="card">
    <div class="presets">
      <span>预设：</span>
      <button class="preset active" data-p="normal">正常初始化</button>
      <button class="preset" data-p="zero">全零初始化</button>
      <button class="preset" data-p="large">学习率过大</button>
      <button class="primary" id="runBtn">▶ 开始监控</button>
      <button class="preset" id="resetBtn">重置</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#2bb673"></span>健康 0.01 ~ 1</span>
      <span><span class="dot" style="background:#f0ad4e"></span>偏大 / 偏小 (&lt;1e-7 或 &gt;5)</span>
      <span><span class="dot" style="background:#d9534f"></span>危险：0（消失）或 &gt;100（爆炸）</span>
    </div>
    <canvas id="cv" width="780" height="360"></canvas>
    <div class="log" id="log"></div>
    <p class="note">提示：选「学习率过大」后点开始，梯度范数会逐 step 攀升，仪表盘依次 <b style="color:#2bb673">绿→黄→红</b>，演示梯度爆炸如何逼近 NaN；选「全零初始化」则梯度恒为 0，红色常亮（典型 bug）。</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  var layers=['fc1.weight','fc1.bias','fc2.weight','fc2.bias','fc3.weight','fc3.bias'];
  var norms=new Array(layers.length).fill(0.3);
  var preset='normal', running=false, raf=null, step=0, factor=1;
  var log=document.getElementById('log');

  function rnd(){return Math.random();}

  function stepOnce(){
    step++;
    if(preset==='normal'){
      for(var i=0;i<layers.length;i++) norms[i]=0.05+rnd()*0.55; // 0.05~0.6 健康
    }else if(preset==='zero'){
      for(var i=0;i<layers.length;i++) norms[i]=0; // 梯度消失/bug
    }else if(preset==='large'){
      factor=Math.min(factor*1.55, 4000);
      for(var i=0;i<layers.length;i++) norms[i]=(0.06+0.03*i)*factor;
    }
  }

  function healthColor(n){
    if(n<1e-7||n>100) return '#d9534f';      // 红
    if(n<0.01||n>5)  return '#f0ad4e';       // 黄
    return '#2bb673';                          // 绿
  }
  function healthLabel(n){
    if(n<1e-7||n>100) return {t:'危险',c:'r'};
    if(n<0.01||n>5)  return {t:'注意',c:'y'};
    return {t:'健康',c:'g'};
  }

  function overall(){
    var anyRed=false, anyYellow=false;
    for(var i=0;i<norms.length;i++){
      var n=norms[i], col=healthColor(n);
      if(col==='#d9534f')anyRed=true; else if(col==='#f0ad4e')anyYellow=true;
    }
    if(anyRed) return {color:'#d9534f',text:'梯度异常（消失 / 爆炸）',cls:'r'};
    if(anyYellow) return {color:'#f0ad4e',text:'梯度不健康（偏小 / 偏大）',cls:'y'};
    return {color:'#2bb673',text:'梯度健康',cls:'g'};
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // 左侧栏背景
    ctx.fillStyle='#f3f6fc';
    ctx.fillRect(12,18,470,H-36);
    ctx.fillStyle='#66748a';ctx.font='13px sans-serif';ctx.textAlign='left';
    ctx.fillText('各层 grad_norm（条形图，对数刻度）',24,38);

    // 条形
    var bx=160, bwMax=300, by0=58, bh=34, gap=8;
    for(var i=0;i<layers.length;i++){
      var y=by0+i*(bh+gap);
      var n=norms[i];
      // 对数刻度映射 1e-9 ~ 1e3 -> 0~1
      var lv=Math.log10(n+1e-12);
      var ratio=Math.max(0,Math.min(1,(lv+9)/12));
      var col=healthColor(n);
      // 层名
      ctx.fillStyle='#1f2933';ctx.font='12.5px sans-serif';ctx.textAlign='right';
      ctx.fillText(layers[i],bx-8,y+bh/2+4);
      // 轨道
      ctx.fillStyle='#e3e9f3';ctx.fillRect(bx,y,bwMax,bh);
      // 条
      ctx.fillStyle=col;ctx.fillRect(bx,y,bwMax*ratio,bh);
      // 数值
      ctx.fillStyle='#1f2933';ctx.font='12px monospace';ctx.textAlign='left';
      var txt = n<1e-7 ? '0' : (n>100? n.toFixed(0) : n.toFixed(4));
      ctx.fillText(txt,bx+bwMax+8,y+bh/2+4);
    }

    // 右侧健康仪表盘
    var gc=620, gy=150, gr=66;
    var ov=overall();
    // 外环
    ctx.beginPath();ctx.arc(gc,gy,gr,0,Math.PI*2);
    ctx.fillStyle='#eef2fb';ctx.fill();
    // 内圆（颜色）
    ctx.beginPath();ctx.arc(gc,gy,gr-12,0,Math.PI*2);
    ctx.fillStyle=ov.color;ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText(ov.cls==='g'?'OK':(ov.cls==='y'?'!':'✕'),gc,gy+6);

    // 右侧文字
    ctx.fillStyle='#1f2933';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText('整体健康度',gc,gy+gr+26);
    ctx.fillStyle=ov.color;ctx.font='bold 14px sans-serif';
    ctx.fillText(ov.text,gc,gy+gr+48);

    // 标尺说明
    ctx.fillStyle='#9aa6b8';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText('step '+step+'　|　预设：'+(preset==='normal'?'正常初始化':preset==='zero'?'全零初始化':'学习率过大'),gc,gy+gr+72);
  }

  function pushLog(){
    var ov=overall();
    var line='step '+String(step).padStart(3,'0')+': ';
    for(var i=0;i<layers.length;i++){
      var n=norms[i], h=healthLabel(n);
      var v=n<1e-7?'0':(n>100?n.toFixed(0):n.toFixed(4));
      line+='<span class="'+h.c+'">'+layers[i]+'='+v+'</span>  ';
    }
    line+=' → <span class="'+ov.cls+'">'+ov.text+'</span>';
    var div=document.createElement('div');div.innerHTML=line;
    log.appendChild(div);
    while(log.children.length>40)log.removeChild(log.firstChild);
    log.scrollTop=log.scrollHeight;
  }

  function loop(){
    if(!running)return;
    stepOnce();render();pushLog();
    raf=setTimeout(function(){requestAnimationFrame(loop);},650);
  }

  function setPreset(p){
    preset=p;factor=1;
    document.querySelectorAll('[data-p]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-p')===p);
    });
  }
  function reset(){
    running=false;if(raf)clearTimeout(raf);
    step=0;factor=1;
    for(var i=0;i<norms.length;i++)norms[i]=0.3;
    log.innerHTML='';render();
  }

  document.querySelectorAll('[data-p]').forEach(function(b){
    b.addEventListener('click',function(){
      setPreset(this.getAttribute('data-p'));
      reset();
    });
  });
  document.getElementById('runBtn').addEventListener('click',function(){
    if(running){running=false;this.textContent='▶ 开始监控';if(raf)clearTimeout(raf);}
    else{running=true;this.textContent='⏸ 暂停';loop();}
  });
  document.getElementById('resetBtn').addEventListener('click',function(){
    document.getElementById('runBtn').textContent='▶ 开始监控';
    reset();
  });

  reset();
})();
</script>
</body>
</html>
