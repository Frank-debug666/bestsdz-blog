<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>索引选择器：看清 shape 再取数</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f7f9fc; color: #1f2937;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .desc { font-size: 14px; color: #6b7280; margin: 0 0 18px; }
  .panel { background:#fff; border:2px solid #e5e7eb; border-radius:16px; padding:20px; max-width:760px; margin:0 auto; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .shapebadge { font-size:14px; font-weight:700; color:#3730a3; background:#eef2ff; padding:8px 14px; border-radius:10px; }
  .grid { display:grid; gap:8px; margin: 14px 0; justify-content:center; }
  .cell {
    width:62px; height:62px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; background:#f3f4f6; border:2px solid #e5e7eb; color:#374151;
    transition: all .15s;
  }
  .cell.hit { background:#dcfce7; border-color:#16a34a; color:#166534; transform:scale(1.05); }
  input[type=text] {
    font-size:16px; padding:10px 12px; border-radius:10px; border:2px solid #cbd5e1;
    width:220px; font-family:monospace; color:#3730a3; font-weight:700;
  }
  button {
    font-size:14px; padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-weight:700; color:#fff;
  }
  .go { background:#6366f1; }
  .rand { background:#0ea5e9; }
  .preset { background:#e2e8f0; color:#334155; }
  .out { margin-top:14px; padding:14px 16px; border-radius:12px; background:#f8fafc; border:2px solid #e5e7eb; font-size:14px; }
  .out .sh { font-weight:700; color:#0f766e; }
  .resgrid { display:grid; gap:6px; margin-top:10px; }
  .rescell { min-width:42px; height:42px; padding:0 8px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#dcfce7; border:1px solid #16a34a; font-weight:700; color:#166534; }
  .err { color:#b91c1c; font-weight:700; }
  .hint { font-size:12px; color:#9ca3af; margin-top:6px; }
  code { background:#eef2ff; padding:1px 6px; border-radius:5px; color:#3730a3; }
</style>
</head>
<body>
  <h1>索引选择器：看清 shape 再取数</h1>
  <p class="desc">先看清 Tensor 的 <code>shape</code>，再决定拿哪一层、哪一行、哪一列。填写索引表达式（如 <code>x[1:, :2]</code>、<code>x[:, 0]</code>、<code>x[0,1]</code>）后点"取数"，被选中的格子高亮，下方显示取出的子 Tensor 的 shape 与数值。</p>

  <div class="panel">
    <div class="row">
      <span class="shapebadge" id="shapeBadge">x.shape = torch.Size([3, 3])</span>
      <button class="rand" onclick="genRandom()">🎲 随机生成 Tensor (2~4 行 × 2~4 列)</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="row">
      <input type="text" id="expr" value="x[1:, :2]" spellcheck="false">
      <button class="go" onclick="runIndex()">取数</button>
    </div>
    <div class="row">
      <span style="font-size:13px;color:#6b7280;">快捷示例：</span>
      <button class="preset" onclick="setExpr('x[0]')">x[0]</button>
      <button class="preset" onclick="setExpr('x[0, 1]')">x[0, 1]</button>
      <button class="preset" onclick="setExpr('x[:, 0]')">x[:, 0]</button>
      <button class="preset" onclick="setExpr('x[1:, :2]')">x[1:, :2]</button>
      <button class="preset" onclick="setExpr('x[:2, 1:]')">x[:2, 1:]</button>
    </div>

    <div class="out" id="out"><span class="sh">结果：</span>输入表达式并点击「取数」。</div>
  </div>

<script>
  let R = 3, C = 3;
  let data = [];

  function genData() {
    R = 2 + Math.floor(Math.random() * 3); // 2..4
    C = 2 + Math.floor(Math.random() * 3); // 2..4
    data = [];
    let v = 1;
    for (let r = 0; r < R; r++) {
      const row = [];
      for (let c = 0; c < C; c++) { row.push(v++); }
      data.push(row);
    }
    renderGrid();
  }

  function renderGrid(hitSet) {
    const g = document.getElementById('grid');
    g.style.gridTemplateColumns = `repeat(${C}, 62px)`;
    g.innerHTML = '';
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const d = document.createElement('div');
        d.className = 'cell' + (hitSet && hitSet.has(r + ',' + c) ? ' hit' : '');
        d.textContent = data[r][c];
        g.appendChild(d);
      }
    }
    document.getElementById('shapeBadge').textContent =
      `x.shape = torch.Size([${R}, ${C}])`;
  }

  function setExpr(s) { document.getElementById('expr').value = s; runIndex(); }

  // 解析一个维度 token: ':' | 'a' | 'a:b' | 'a:' | ':b'
  function parseDim(tok) {
    tok = tok.trim();
    if (tok === ':') return { type: 'all' };
    if (tok.includes(':')) {
      const [a, b] = tok.split(':');
      const start = a === '' ? 0 : parseInt(a, 10);
      let end = b === '' ? null : parseInt(b, 10);
      if (isNaN(start)) throw new Error('非法切片');
      return { type: 'slice', start, end };
    }
    const i = parseInt(tok, 10);
    if (isNaN(i)) throw new Error('非法索引: ' + tok);
    return { type: 'idx', i };
  }

  function normRange(d, n) {
    if (d.type === 'all') return [0, n];
    if (d.type === 'slice') {
      let s = d.start, e = d.end == null ? n : d.end;
      if (s < 0) s += n; if (e < 0) e += n;
      s = Math.max(0, s); e = Math.min(n, e);
      if (s > e) e = s;
      return [s, e];
    }
    return null; // idx
  }

  function runIndex() {
    const raw = document.getElementById('expr').value.trim();
    const out = document.getElementById('out');
    let inner = raw;
    if (raw.startsWith('x')) inner = raw.slice(1);
    const m = inner.match(/^\[(.+)\]$/);
    if (!m) { renderGrid(new Set()); out.innerHTML = '<span class="err">表达式格式应为 x[...]，例如 x[1:, :2]</span>'; return; }
    let dims;
    try { dims = m[1].split(',').map(parseDim); }
    catch (e) { renderGrid(new Set()); out.innerHTML = '<span class="err">' + e.message + '</span>'; return; }

    if (dims.length !== 1 && dims.length !== 2) {
      renderGrid(new Set());
      out.innerHTML = '<span class="err">本演示仅支持 1 维（取行）或 2 维（行,列）索引</span>';
      return;
    }

    const d0 = normRange(dims[0], R);
    const hit = new Set();
    let rows;
    if (dims[0].type === 'idx') {
      let i = dims[0].i; if (i < 0) i += R; rows = [i];
    } else { rows = []; for (let r = d0[0]; r < d0[1]; r++) rows.push(r); }

    let cols = null;
    if (dims.length === 2) {
      const d1 = normRange(dims[1], C);
      if (dims[1].type === 'idx') {
        let j = dims[1].i; if (j < 0) j += C; cols = [j];
      } else { cols = []; for (let c = d1[0]; c < d1[1]; c++) cols.push(c); }
    } else {
      cols = []; for (let c = 0; c < C; c++) cols.push(c);
    }

    // 标记选中
    rows.forEach(r => cols.forEach(c => hit.add(r + ',' + c)));
    renderGrid(hit);

    // 构造结果
    const sub = rows.map(r => cols.map(c => data[r][c]));
    // 计算 shape（整数索引会降维）
    const shape = [];
    if (dims[0].type !== 'idx') shape.push(rows.length);
    if (dims.length === 2 && dims[1].type !== 'idx') shape.push(cols.length);

    let resHTML = '';
    if (shape.length === 0) {
      resHTML = `<div class="resgrid" style="grid-template-columns:auto;">` +
        `<div class="rescell">${sub[0][0]}</div></div>`;
    } else if (shape.length === 1) {
      const flat = sub.flat();
      resHTML = `<div class="resgrid" style="grid-template-columns:repeat(${flat.length},auto);">` +
        flat.map(v => `<div class="rescell">${v}</div>`).join('') + `</div>`;
    } else {
      resHTML = `<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">` +
        sub.map(row => `<div class="resgrid" style="grid-template-columns:repeat(${row.length},auto);">` +
          row.map(v => `<div class="rescell">${v}</div>`).join('') + `</div>`).join('') + `</div>`;
    }

    const shapeStr = shape.length ? `torch.Size([${shape.join(', ')}])` : 'torch.Size([])';
    out.innerHTML = `<span class="sh">取出 shape = ${shapeStr}</span> ` +
      `<span style="color:#6b7280;">（数值如下）</span>` + resHTML;
  }

  genData();
  runIndex();
</script>
</body>
</html>
