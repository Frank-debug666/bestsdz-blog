<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备探测仪 · 交互演示</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2d3d;--sub:#7b8794;--line:#e3e8ef;--accent:#2f80ed;--green:#27ae60;--red:#eb5757;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.5;}
  .wrap{max-width:880px;margin:0 auto;padding:24px 18px 40px;}
  h1{font-size:22px;margin:0 0 4px;}
  .desc{color:var(--sub);font-size:13px;margin:0 0 18px;background:#eef4ff;padding:10px 14px;border-radius:8px;border:1px solid #d6e4ff;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 14px;}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px;}
  select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;}
  .lights{display:flex;gap:14px;margin:6px 0 4px;}
  .light{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:14px 6px;background:#fbfcfe;}
  .dot{width:26px;height:26px;border-radius:50%;background:#d6dde4;margin:0 auto 8px;box-shadow:inset 0 0 4px rgba(0,0,0,.2);transition:.25s;}
  .dot.on.g{background:#27ae60;box-shadow:0 0 12px #27ae60;}
  .dot.on.r{background:#eb5757;box-shadow:0 0 12px #eb5757;}
  .light .t{font-size:13px;font-weight:600;}
  .light .s{font-size:10px;color:var(--sub);}
  .out{background:#0f1b2d;color:#cfe3ff;border-radius:10px;padding:14px 16px;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;min-height:120px;}
  .out .k{color:#7f9cff;}
  .out .v{color:#7fffb0;}
  .out .bad{color:#ff8a8a;}
  .device-box{margin-top:12px;font-family:Consolas,monospace;font-size:13px;background:#eef4ff;padding:10px 12px;border-radius:8px;}
  .device-box b{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>设备探测仪</h1>
  <p class="desc">核心需求：点击「运行 torch.cuda.is_available()」根据当前（假设）环境点亮 CPU / 单卡 CUDA / 多卡 CUDA 指示灯，并显示 device_count() 与 get_device_name(0)；用下拉框“假设”有卡/无卡环境，直观看到 device 变量在 cpu / cuda 间变化。</p>

  <div class="card">
    <h2>① 假设运行环境</h2>
    <label>选择本机环境（演示用，可切换假设）</label>
    <select id="env">
      <option value="none">无 GPU（纯 CPU 服务器）</option>
      <option value="single" selected>单卡 CUDA（如 1 × RTX 4090）</option>
      <option value="multi">多卡 CUDA（如 4 × A100）</option>
    </select>
    <div style="margin-top:14px;">
      <button id="detect">▶ 运行 torch.cuda.is_available()</button>
    </div>
  </div>

  <div class="card">
    <h2>② 设备指示灯</h2>
    <div class="lights">
      <div class="light"><div class="dot" id="lCpu"></div><div class="t">CPU</div><div class="s">始终可用</div></div>
      <div class="light"><div class="dot" id="lSingle"></div><div class="t">单卡 CUDA</div><div class="s">1 张 N 卡</div></div>
      <div class="light"><div class="dot" id="lMulti"></div><div class="t">多卡 CUDA</div><div class="s">≥2 张 N 卡</div></div>
    </div>
  </div>

  <div class="card">
    <h2>③ 探测结果</h2>
    <div class="out" id="out">// 点击上方按钮运行探测…</div>
    <div class="device-box" id="devbox" style="display:none;"></div>
  </div>
</div>

<script>
(function(){
  const $ = id=>document.getElementById(id);
  const NAME = {none:'—', single:'NVIDIA GeForce RTX 4090', multi:'NVIDIA A100-SXM4-80GB'};
  const COUNT = {none:0, single:1, multi:4};

  function detect(){
    const env = $('env').value;
    const avail = COUNT[env] > 0;
    // 灯
    $('lCpu').className = 'dot on g';
    $('lSingle').className = 'dot' + (env==='single' ? ' on g' : '');
    $('lMulti').className = 'dot' + (env==='multi' ? ' on g' : '');
    // 输出
    const dev = avail ? 'cuda' : 'cpu';
    $('out').innerHTML =
      '<span class="k">torch.cuda.is_available()</span>  →  ' +
        (avail ? '<span class="v">True</span>' : '<span class="bad">False</span>') + '\n' +
      '<span class="k">torch.cuda.device_count()</span>   →  <span class="v">' + COUNT[env] + '</span>\n' +
      '<span class="k">torch.cuda.get_device_name(0)</span> →  ' +
        (avail ? '<span class="v">' + NAME[env] + '</span>' : '<span class="bad">无可用设备</span>') + '\n\n' +
      '<span class="k">device = torch.device(</span>\'cuda\' if torch.cuda.is_available() else \'cpu\'<span class="k">)</span>\n' +
      '→ 解析为  <span class="' + (avail?'v':'bad') + '">"' + dev + '"</span>';
    $('devbox').style.display='block';
    $('devbox').innerHTML = '当前 <b>device</b> 变量 = <b>"' + dev + '"</b>　' +
      (avail ? '（代码会自动启用 GPU 加速）' : '（无卡，安全回退到 CPU）');
  }
  $('detect').addEventListener('click', detect);
  $('env').addEventListener('change', ()=>{ // 切换假设时清空结果
    ['lCpu','lSingle','lMulti'].forEach(i=>$(i).className='dot');
    $('out').textContent='// 已切换假设环境，请重新点击「运行探测」';
    $('devbox').style.display='none';
  });
})();
</script>
</body>
</html>
