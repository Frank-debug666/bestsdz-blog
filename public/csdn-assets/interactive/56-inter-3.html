<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多卡数据并行 · 交互动画</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2d3d;--sub:#7b8794;--line:#e3e8ef;
    --accent:#2f80ed;--green:#27ae60;--red:#eb5757;--orange:#f2994a;--purple:#9b51e0;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.5;}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 40px;}
  h1{font-size:22px;margin:0 0 4px;}
  .desc{color:var(--sub);font-size:13px;margin:0 0 18px;background:#eef4ff;padding:10px 14px;border-radius:8px;border:1px solid #d6e4ff;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .ctrl{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;}
  .ctrl .grp{display:flex;flex-direction:column;}
  label{font-size:12px;color:var(--sub);margin-bottom:5px;}
  .seg{display:flex;gap:6px;}
  .seg button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  input[type=range]{width:200px;accent-color:var(--accent);}
  .val{font-weight:700;color:var(--accent);}
  .btns{display:flex;gap:8px;}
  .btns button{cursor:pointer;border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;}
  .b-go{background:var(--green);color:#fff;}
  .b-reset{background:#eef2f7;color:var(--ink);}
  canvas{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;}
  .metrics{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
  .metric{flex:1;min-width:180px;background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .metric .k{font-size:11px;color:var(--sub);}
  .metric .v{font-size:18px;font-weight:800;color:var(--accent);}
  .bar{height:8px;background:#eef2f7;border-radius:4px;margin-top:6px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:.3s;}
  .note{font-size:12px;color:var(--sub);margin-top:10px;}
  .note b{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <h1>多卡数据并行（DataParallel）动画</h1>
  <p class="desc">核心需求：顶部一个 batch 被均分成 N 份飞向各卡 → 各卡“前向+反向”→ 梯度箭头飞回主卡 → 主卡“平均→更新→广播”。调节卡数与 batch_size，观察“卡越多、单卡负担越小、但主卡汇总开销越明显”，从而理解 DP 瓶颈与 DDP 的动机。</p>

  <div class="panel">
    <div class="ctrl">
      <div class="grp">
        <label>GPU 卡数</label>
        <div class="seg" id="gpuSeg">
          <button data-n="1">1</button>
          <button data-n="2">2</button>
          <button data-n="4" class="on">4</button>
          <button data-n="8">8</button>
        </div>
      </div>
      <div class="grp">
        <label>batch_size <span class="val" id="vBs">64</span></label>
        <input type="range" id="bs" min="32" max="256" step="16" value="64">
      </div>
      <div class="grp">
        <label>&nbsp;</label>
        <div class="btns">
          <button class="b-go" id="go">▶ 开始训练</button>
          <button class="b-reset" id="reset">重置</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <canvas id="cv" width="760" height="440"></canvas>
    <div class="metrics">
      <div class="metric"><div class="k">单卡样本数 (batch ÷ 卡数)</div><div class="v" id="mPer">16</div></div>
      <div class="metric"><div class="k">主卡汇总通信开销（∝ 卡数）</div><div class="v" id="mOv">4×</div>
        <div class="bar"><i id="mBar" style="width:50%"></i></div></div>
    </div>
    <p class="note" id="insight">提示：卡数翻倍 → 单卡负担减半，但所有梯度都要汇总回主卡，<b>主卡瓶颈随卡数线性加重</b>。卡很多时，应改用 DDP（Ring AllReduce 对等同步，消除单点瓶颈）。</p>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=760,H=440;
  let n=4, bs=64, animId=null, startT=0;
  const DUR=6500;

  const $=id=>document.getElementById(id);
  function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function lerp(a,b,t){return a+(b-a)*t;}

  function metrics(){
    const per=Math.round(bs/n);
    $('mPer').textContent=per;
    $('mOv').textContent=n+'×';
    $('mBar').style.width=(n/8*100)+'%';
  }

  function cardPos(i){
    const cw=120, gap=18, total=n*cw+(n-1)*gap;
    const x0=(W-total)/2;
    return {x:x0+i*(cw+gap), y:170, w:cw, h:96, cx:x0+i*(cw+gap)+cw/2, cy:170+48};
  }
  const topBatch={cx:W/2, cy:54};
  const master={cx:W/2, cy:382};

  function drawStatic(p){
    ctx.clearRect(0,0,W,H);
    // 顶部 batch
    const bw=Math.min(360, 60+bs*1.1), bh=36;
    ctx.fillStyle='#eef4ff'; ctx.strokeStyle='#2f80ed'; ctx.lineWidth=2;
    roundRect(topBatch.cx-bw/2, topBatch.cy-bh/2, bw, bh, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#1f2d3d'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('batch = '+bs+' 个样本（主卡持有）', topBatch.cx, topBatch.cy+4);

    // 卡片
    for(let i=0;i<n;i++){
      const c=cardPos(i);
      const computing = p>=0.30 && p<0.55;
      ctx.fillStyle = computing ? '#e9fbf0' : '#fbfcfe';
      ctx.strokeStyle = computing ? '#27ae60' : '#cbd2d9';
      ctx.lineWidth = computing ? 3 : 1.5;
      roundRect(c.x,c.y,c.w,c.h,10); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#1f2d3d'; ctx.font='bold 13px sans-serif';
      ctx.fillText('GPU '+i, c.cx, c.y+20);
      // 卡内样本块
      if(p>=0.30){
        const sp=Math.max(1,Math.round(bs/n));
        ctx.fillStyle='#2f80ed'; ctx.globalAlpha=0.85;
        const sw=c.w-40, sh=26;
        roundRect(c.cx-sw/2, c.y+34, sw, sh, 5); ctx.fill(); ctx.globalAlpha=1;
        ctx.fillStyle='#fff'; ctx.font='11px sans-serif';
        ctx.fillText(sp+' 样本', c.cx, c.y+51);
        if(computing){ ctx.fillStyle='#27ae60'; ctx.font='bold 11px sans-serif'; ctx.fillText('前向+反向', c.cx, c.y+c.h-8); }
        else if(p>=0.55){ ctx.fillStyle='#9aa5b1'; ctx.font='11px sans-serif'; ctx.fillText('已算完', c.cx, c.y+c.h-8); }
      }
    }

    // 主卡汇总节点
    const aggre = p>=0.80;
    const pulse = aggre ? 46+Math.sin((p-0.80)/0.20*Math.PI)*8 : 46;
    ctx.beginPath(); ctx.arc(master.cx,master.cy,pulse,0,Math.PI*2);
    ctx.fillStyle='#fdecec'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle= aggre? '#eb5757':'#f3b5b5'; ctx.stroke();
    ctx.fillStyle='#c0392b'; ctx.font='bold 12px sans-serif';
    ctx.fillText('主卡 cuda:0', master.cx, master.cy-6);
    ctx.fillText(aggre?'平均→更新→广播':'汇总梯度', master.cx, master.cy+12);
    if(n>=2){
      ctx.fillStyle='#eb5757'; ctx.font='11px sans-serif';
      ctx.fillText('⚠ 瓶颈点', master.cx, master.cy+pulse+16);
    }
  }

  function drawDynamic(p){
    // 拆分层：子块从顶部飞向各卡
    if(p<0.30){
      const sp=ease(p/0.30);
      for(let i=0;i<n;i++){
        const c=cardPos(i);
        const x=lerp(topBatch.cx, c.cx, sp), y=lerp(topBatch.cy, c.cy-30, sp);
        ctx.fillStyle='#2f80ed'; ctx.globalAlpha=0.9;
        roundRect(x-22,y-12,44,24,5); ctx.fill(); ctx.globalAlpha=1;
      }
      ctx.fillStyle='#7b8794'; ctx.font='12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('① 主卡把 batch 均分成 '+n+' 份', W/2, 110);
    }
    // 梯度回传层：箭头从各卡飞回主卡
    else if(p>=0.55 && p<0.80){
      const gp=ease((p-0.55)/0.25);
      ctx.strokeStyle='#eb5757'; ctx.lineWidth=2.5; ctx.fillStyle='#eb5757';
      for(let i=0;i<n;i++){
        const c=cardPos(i);
        const sx=c.cx, sy=c.y+c.h;
        const ex=lerp(sx,master.cx,gp), ey=lerp(sy,master.cy-pulse(0),gp);
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
        if(gp>0.5){ // 箭头
          const ang=Math.atan2(master.cy-sy, master.cx-sx);
          ctx.beginPath();
          ctx.moveTo(ex,ey);
          ctx.lineTo(ex-9*Math.cos(ang-0.4), ey-9*Math.sin(ang-0.4));
          ctx.lineTo(ex-9*Math.cos(ang+0.4), ey-9*Math.sin(ang+0.4));
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.fillStyle='#7b8794'; ctx.font='12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('③ '+n+' 张卡梯度箭头汇聚回主卡', W/2, 300);
    }
    else if(p>=0.30 && p<0.55){
      ctx.fillStyle='#7b8794'; ctx.font='12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('② 各卡并行 前向 + 反向', W/2, 300);
    }
  }
  function pulse(){return 46;}

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function frame(now){
    const p=Math.min(1,(now-startT)/DUR);
    drawStatic(p); drawDynamic(p);
    if(p<1){ animId=requestAnimationFrame(frame); }
  }

  function go(){
    cancelAnimationFrame(animId);
    startT=performance.now();
    animId=requestAnimationFrame(frame);
  }
  function reset(){
    cancelAnimationFrame(animId);
    drawStatic(0); drawDynamic(0);
  }

  // 事件
  $('gpuSeg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    [...$('gpuSeg').children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); n=+b.dataset.n; metrics(); reset();
  });
  $('bs').addEventListener('input',e=>{ bs=+e.target.value; $('vBs').textContent=bs; metrics(); reset(); });
  $('go').addEventListener('click',go);
  $('reset').addEventListener('click',reset);

  metrics(); reset();
})();
</script>
</body>
</html>
